<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
<title>远程桌面</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #0e1116; color: #e6e9ef;
    font: 13px/1.5 -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; }
  body { overflow-y: auto; -webkit-overflow-scrolling: touch; }
  #app { display: flex; flex-direction: column; height: 100%;
    /* 键盘/候选栏避让的位移做短过渡：任何必要的微调变成平滑滑入，杜绝突跳式「二次上移」观感 */
    transition: transform .12s ease, height .12s ease; }

  /* ---- 工具条 ---- */
  .bar { display: flex; align-items: center; gap: 6px; padding: 6px 8px;
    background: #161b22; border-bottom: 1px solid #262d38; flex: 0 0 auto; flex-wrap: wrap; }
  .bar button, .bar select { background: #21262d; color: #c9d1d9; border: 1px solid #30363d;
    border-radius: 7px; padding: 5px 10px; font-size: 12.5px; cursor: pointer; }
  .bar button:hover:not(:disabled) { background: #2d333b; border-color: #3d444d; }
  .bar button:disabled { opacity: .5; cursor: default; }
  .bar button.on { background: #1f6feb; border-color: #1f6feb; color: #fff; }
  .bar .sep { width: 1px; height: 20px; background: #30363d; margin: 0 3px; }
  .bar .sp { flex: 1; }
  .state { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; color: #8b949e; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #6e7681; }
  .dot.on { background: #3fb950; box-shadow: 0 0 6px #3fb95088; }
  .dot.err { background: #f85149; box-shadow: 0 0 6px #f8514988; }
  .dot.wait { background: #d29922; animation: pulse 1s infinite; }
  @keyframes pulse { 50% { opacity: .35; } }

  /* ---- 高级参数 ---- */
  .adv { display: flex; align-items: center; gap: 12px; padding: 8px 10px;
    background: #12171f; border-bottom: 1px solid #262d38; flex: 0 0 auto; flex-wrap: wrap; }
  .adv label { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; color: #8b949e; }
  .adv input[type=range] { width: 92px; }
  .adv .v { color: #c9d1d9; min-width: 30px; display: inline-block; }

  /* ---- 画面 ---- */
  /* 居中必须用 margin:auto 而不是 align-items:center：后者在内容大于容器时会把
     顶部溢出到容器外，且滚动条够不到那一部分（flex 居中的经典陷阱），表现为
     「画面显示不全、上面一截看不到也滚不上去」。flex:0 0 auto 防止画布被压缩。 */
  .view { flex: 1; overflow: auto; background: #0e1116; position: relative;
    display: flex; touch-action: none; }
  .view.grabbing { cursor: grabbing; }
  #screen { display: block; background: #000; box-shadow: 0 0 0 1px #262d38;
    -webkit-user-drag: none; user-select: none; touch-action: none;
    margin: auto; flex: 0 0 auto; }
  canvas { touch-action: none; }
  .overlay { position: absolute; inset: 0; display: flex; align-items: center;
    justify-content: center; flex-direction: column; gap: 10px; text-align: center;
    padding: 20px; background: rgba(14,17,22,.94); z-index: 5; }
  .overlay h3 { margin: 0; font-size: 15px; font-weight: 600; }
  .overlay p { margin: 0; font-size: 12.5px; color: #8b949e; max-width: 460px; line-height: 1.7; }
  .overlay button { background: #1f6feb; color: #fff; border: none; border-radius: 8px;
    padding: 8px 18px; font-size: 13px; cursor: pointer; }
  .overlay button.ghost { background: #21262d; color: #c9d1d9; border: 1px solid #30363d; }
  .overlay .spin { width: 22px; height: 22px; border: 2px solid #30363d;
    border-top-color: #1f6feb; border-radius: 50%; animation: sp .8s linear infinite; }
  @keyframes sp { to { transform: rotate(360deg); } }

  /* ---- 底部状态 ---- */
  .foot { flex: 0 0 auto; display: flex; align-items: center; gap: 10px;
    padding: 5px 10px; background: #161b22; border-top: 1px solid #262d38;
    font-size: 11.5px; color: #6e7681; }
  .foot .warn { color: #d29922; }
  .foot .sp { flex: 1; }
  /* 软键盘输入框：必须**留在视口内**（不能 left:-9999px 移出屏幕），否则 webview 不弹键盘。
     opacity:0 隐形；font-size:16px 避免 iOS 聚焦自动放大；caret-color:transparent 隐藏光标。
     关键：保持在正常流、紧随 #app 之后、高度仅 1px——focus 时 #kb 落在 #app 正下方(=可视高顶部)，
     adjustPan 为把它露出键盘而把整窗上移，#app 整块落到键盘之上。height 保持极小（绝撑高 body），
     否则平移目标会落到键盘下方、反倒把内容顶没。 */
  #kb { position: relative; opacity: 0; width: 100%; height: 1px; border: 0; margin: 0;
    padding: 0; display: block; resize: none; font-size: 16px; caret-color: transparent; }

  /* ---- 点击反馈动画 ---- */
  .click-fx { position: absolute; width: 22px; height: 22px; margin: -11px 0 0 -11px;
    border: 2px solid #58a6ff; border-radius: 50%; pointer-events: none; z-index: 4;
    box-shadow: 0 0 8px #58a6ff99; animation: clickpop .36s ease-out forwards; }
  @keyframes clickpop {
    0%   { transform: scale(.4); opacity: .9; }
    100% { transform: scale(2.6); opacity: 0; }
  }

  /* ---- 触摸指示器：按下**立刻**显示 ----
     解决两个体验问题：
     ① 此前只有松手才出波纹，按下瞬间用户不知道自己按在了哪里——现在按下即有落点指示。
     ② 长按阈值(550ms)对用户完全不可见——内圈在 RIGHT_DELAY 内逐渐长满，
        长满即触发右键，用户能直观看到「还要按住多久」，不必猜两个时间段。 */
  /* z-index 取 4（与 click-fx 同级）：高于画布，但低于 z-index:5 的引导浮层，
     这样代理未运行等浮层出现时能正常盖住它。 */
  .touch-ind { position: absolute; width: 48px; height: 48px; margin: -24px 0 0 -24px;
    border-radius: 50%; pointer-events: none; z-index: 4; display: none;
    border: 2px solid rgba(88,166,255,.9); box-shadow: 0 0 10px rgba(88,166,255,.45);
    background: rgba(88,166,255,.08); }
  .touch-ind.on { display: block; }
  /* 内圈 = 长按进度：时长由 --dur 与 RIGHT_DELAY 保持一致 */
  .touch-ind .fill { position: absolute; top: 7px; left: 7px; right: 7px; bottom: 7px;
    border-radius: 50%; background: rgba(88,166,255,.5); transform: scale(0); }
  .touch-ind.charging .fill { transform: scale(1); transition: transform var(--dur, 550ms) linear; }
  /* 长按完成 → 右键：变绿，明确告知已触发 */
  .touch-ind.right { border-color: #3fb950; box-shadow: 0 0 14px rgba(63,185,80,.75);
    background: rgba(63,185,80,.14); }
  .touch-ind.right .fill { background: rgba(63,185,80,.8); transform: scale(1); transition: none; }
  /* 判定为平移视角（未武装就拖动）：取消充电并淡化，明确表示「这次不会点击远端」 */
  .touch-ind.drag { border-color: rgba(139,148,158,.8); box-shadow: none; opacity: .5; }
  .touch-ind.drag .fill { transform: scale(0); transition: transform .12s ease-out; }
  /* 已武装（按住满 DRAG_HOLD）：橙色 = 此时拖动将**拖拽远端内容**，而非平移视角。
     内圈仍在长，继续按住到 RIGHT_DELAY 会转绿触发右键。 */
  .touch-ind.armed { border-color: #d29922; box-shadow: 0 0 14px rgba(210,153,34,.7);
    background: rgba(210,153,34,.14); }
  .touch-ind.armed .fill { background: rgba(210,153,34,.85); }
  /* 正在远程拖拽（左键已按下并跟随） */
  .touch-ind.remote { border-color: #a371f7; box-shadow: 0 0 16px rgba(163,113,247,.8);
    background: rgba(163,113,247,.18); }
  .touch-ind.remote .fill { background: rgba(163,113,247,.85); transform: scale(1); transition: none; }
</style>
</head>
<body>
<div id="app">
  <div class="bar">
    <span class="state"><i class="dot" id="dot"></i><span id="state-txt">连接中…</span></span>
    <button id="btn-reconnect" title="断开后手动重连（也可等自动重连）">⟳ 重连</button>
    <button id="btn-restart-agent" title="重启桌面代理进程（应用输入/绘制等修复时用到；会短暂断一下）">⟲ 重启代理</button>
    <button id="btn-kb" title="弹出手机软键盘（再点此或系统收起键即可关闭）">⌨ 键盘</button>
    <button id="btn-cursor" class="on" title="显示 / 隐藏远程鼠标指针（指针烘焙进画面，切换会重建画面流）">🖱 鼠标</button>
    <span class="sep"></span>
    <button data-fit="1" title="缩放至适应窗口">适应</button>
    <button data-fit="0" title="按屏幕原始像素 1:1 显示">100%</button>
    <button id="zoom-out" title="缩小">−</button>
    <span class="state" id="zoom-val" style="min-width:44px;text-align:center">100%</span>
    <button id="zoom-in" title="放大">＋</button>
    <span class="sep"></span>
    <select id="preset" title="画质与流量档位">
      <option value="smooth">流畅</option>
      <option value="balanced" selected>均衡</option>
      <option value="saver">省流量</option>
    </select>
    <button id="btn-adv" title="展开细项调节">⚙</button>
    <span class="sp"></span>
    <button id="btn-fs" title="全屏">⛶</button>
  </div>

  <div class="adv" id="adv" style="display:none">
    <label>帧率 <input type="range" id="a-fps" min="1" max="30" step="1" value="8" /><span class="v" id="v-fps">8</span></label>
    <label>画质 <input type="range" id="a-q" min="20" max="95" step="5" value="60" /><span class="v" id="v-q">60</span></label>
    <label>分辨率 <input type="range" id="a-scale" min="30" max="100" step="10" value="100" /><span class="v" id="v-scale">100%</span></label>
    <label><input type="checkbox" id="a-gray" /> 灰度</label>
    <label><input type="checkbox" id="a-still" checked /> 静止不推帧</label>
    <button id="btn-apply">应用</button>
    <button id="btn-reset">跟随档位</button>
  </div>

  <div class="view" id="view">
    <canvas id="screen"></canvas>
    <div class="overlay" id="ov">
      <div class="spin" id="ov-spin"></div>
      <h3 id="ov-title">正在连接…</h3>
      <p id="ov-text"></p>
      <div id="ov-btns" style="display:flex;gap:8px"></div>
    </div>
  </div>

  <div class="foot">
    <span id="f-meta">—</span>
    <span class="sp"></span>
    <span class="warn" id="f-warn"></span>
    <span id="f-tip">滚轮＝远程滚动 · Ctrl+滚轮＝本地缩放 · 中键拖拽＝平移 · 触屏：单指滑＝平移视角，轻点＝左键，长按＝右键，双指捏合＝缩放/平移</span>
  </div>
</div>
<textarea id="kb" autocomplete="off" spellcheck="false"></textarea>

<script>
(function () {
  'use strict';
  // 必须是**绝对路径**：面板跑在 about:srcdoc 的 iframe 里，location.pathname 是
  // "about:srcdoc" 而不是 dbox 的路径，拿它拼前缀会拼出 about:srcdoc/api/... 直接发不出去
  //（表现为「服务不可达」）。全屏页 /ext/remote 下同样适用——API 前缀与页面路径无关。
  var API = '/api/ext/remote';
  var $ = function (id) { return document.getElementById(id); };
  // 服务端返回的错误信息可能含系统输出，一律转义后再塞进 innerHTML
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  // ---- token：**宿主实时推送的优先** ----
  // access token 有效期只有 24 小时（ACCESS_TOKEN_EXPIRE_HOURS），且刷新令牌续签后
  // 新 token 由宿主经 postMessage 下发。旧实现把 localStorage 那份排在 PUSHED 前面，
  // 于是过期 token 会一直被优先使用——叠加 /status 对 401 的静默处理，
  // 表现就是「重启电脑/隔天再进来，永远卡在重连中，且毫无提示」。
  var PUSHED = null;
  window.addEventListener('message', function (e) {
    if (e.data && e.data.type === 'DBOX_TOKEN' && e.data.token) PUSHED = e.data.token;
  });
  function requestToken() {
    try { window.parent.postMessage({ type: 'DBOX_REQUEST_TOKEN', extId: 'remote' }, '*'); } catch (_) {}
  }
  requestToken();
  function token() {
    try {
      return PUSHED || localStorage.getItem('token') || localStorage.getItem('access_token')
        || sessionStorage.getItem('token') || '';
    } catch (_) { return PUSHED || ''; }
  }
  // 401 多半是 token 过期：先向宿主再要一次最新 token，稍等其送达后重试一次。
  // 宿主会自动续签 access token，这一步让「隔天进来」的场景自愈，不必手动刷新页面。
  function api(path, opts) {
    opts = opts || {};
    function once() {
      return fetch(API + path, Object.assign({}, opts, {
        headers: Object.assign({ 'Authorization': 'Bearer ' + token() }, opts.headers || {}),
      }));
    }
    return once().then(function (r) {
      if (r.status !== 401) return r;
      requestToken();
      return new Promise(function (res) { setTimeout(res, 400); }).then(once);
    });
  }

  // ---- 状态 ----
  var BASE_PRESETS = {   // 永不随服务端 presets 响应被覆盖的基准，切换/重置兜底用
    smooth:   { fps: 15, q: 72, scale: 100, gray: false, still: false, cursor: true },
    balanced: { fps: 8,  q: 60, scale: 100, gray: false, still: true,  cursor: true },
    saver:    { fps: 3,  q: 42, scale: 70,  gray: false, still: true,  cursor: true },
  };
  var PRESETS = Object.assign({}, BASE_PRESETS);   // 可被服务端 d.presets 局部覆盖，但三档基准始终在
  var cfg = Object.assign({}, BASE_PRESETS.balanced);
  var presetName = 'balanced';
  var screenW = 0, screenH = 0;      // 屏幕真实尺寸（用于坐标映射，取自 /status）
  var zoom = 1, fitMode = true;

  // ================= 参数 / 视图持久化（单键原子 JSON）=================
  // 教训：旧实现只存 fitMode 不存 zoom 与滚动——刷新后 zoom 重置为 1，而 fitMode=false 时
  // applyZoom 不再重算缩放，画面被放大到 100%，滚动又归零 → 甩到左上角。所以「缩放模式 + 缩放值 + 横纵滚动」必须一起存。
  // 统一写进一个 JSON（remote_prefs）避免多键不一致；读取时逐字段校验，非法值丢弃回基准。
  var PREF_KEY = 'remote_prefs';
  var savedView = { sl: 0, st: 0 };      // 待还原的平移位置（画布尺寸就绪后才写入）
  function numOr(v, lo, hi, dft) { return (typeof v === 'number' && isFinite(v) && v >= lo && v <= hi) ? v : dft; }
  function boolOr(v, dft) { return (typeof v === 'boolean') ? v : dft; }

  function readPrefs() {
    var raw = null;
    try { raw = localStorage.getItem(PREF_KEY); }
    catch (e) { try { raw = window.parent.localStorage.getItem(PREF_KEY); } catch (e2) {} }
    try {
      var o = JSON.parse(raw || 'null');
      if (o && o.cfg) {
        cfg.fps   = numOr(o.cfg.fps, 1, 30, cfg.fps);
        cfg.q     = numOr(o.cfg.q, 20, 95, cfg.q);
        cfg.scale = numOr(o.cfg.scale, 30, 100, cfg.scale);   // 分辨率非法 → 退回 100（清晰）
        cfg.gray   = boolOr(o.cfg.gray, cfg.gray);
        cfg.still  = boolOr(o.cfg.still, cfg.still);
        cfg.cursor = boolOr(o.cfg.cursor, cfg.cursor);
      }
      if (o && o.preset && BASE_PRESETS[o.preset]) presetName = o.preset;
      if (o && o.view) {
        fitMode = boolOr(o.view.fit, fitMode);
        zoom    = numOr(o.view.zoom, 0.1, 4, zoom);           // 手动缩放值一并还原
        savedView.sl = numOr(o.view.sl, 0, 1e6, 0);
        savedView.st = numOr(o.view.st, 0, 1e6, 0);
      }
    } catch (e) {}
    $('btn-cursor').classList.toggle('on', !!cfg.cursor);   // 按钮初始态跟随已存设置
    $('preset').value = presetName;
  }
  function writePrefs() {
    var o = {
      cfg: { fps: cfg.fps, q: cfg.q, scale: cfg.scale, gray: cfg.gray, still: cfg.still, cursor: cfg.cursor },
      preset: presetName,
      view: { fit: fitMode, zoom: zoom, sl: view ? view.scrollLeft : 0, st: view ? view.scrollTop : 0 },
    };
    var s = JSON.stringify(o);
    try { localStorage.setItem(PREF_KEY, s); }
    catch (e) { try { window.parent.localStorage.setItem(PREF_KEY, s); } catch (e2) {} }
  }
  var prefT = null;
  function savePrefsSoon() { clearTimeout(prefT); prefT = setTimeout(writePrefs, 200); }   // 捏合/滚动等高频变更防抖落盘
  readPrefs();
  // 清理旧版多键存档（remote_cfg / remote_preset / remote_fitMode），避免残留干扰
  ['remote_cfg', 'remote_preset', 'remote_fitMode'].forEach(function (k) {
    try { localStorage.removeItem(k); } catch (e) { try { window.parent.localStorage.removeItem(k); } catch (e2) {} }
  });

  // 画布尺寸就绪（screenW 已知且 applyZoom 已铺好画布）后还原平移位置，只做一次。
  var viewRestored = false;
  function restoreView() {
    if (viewRestored || !screenW) return;
    viewRestored = true;
    if (fitMode) return;                                  // 适应模式内容自适应，无需平移
    var maxL = Math.max(0, view.scrollWidth - view.clientWidth);
    var maxT = Math.max(0, view.scrollHeight - view.clientHeight);
    view.scrollLeft = Math.min(savedView.sl, maxL);
    view.scrollTop = Math.min(savedView.st, maxT);
  }
  var online = false, autostart = false;
  var retry = 0, retryTimer = null, pollTimer = null;

  var view = $('view');
  var canvas = $('screen');
  // 画面四周留黑边缓冲：远端屏幕边缘不与手机屏幕边缘贴合，方便点击靠近屏幕边缘的元素。
  // 取屏幕尺寸较小边的一定比例，夹在 [20,40] 之间，保证手机/桌面都留得舒服。
  // 该值同时用于 fit 缩放计算（扣掉边距）与 .view 的实际 padding，务必同源。
  var EDGE_PAD = Math.round(Math.min(window.innerWidth, window.innerHeight) * 0.06);
  EDGE_PAD = Math.max(20, Math.min(40, EDGE_PAD));
  view.style.padding = EDGE_PAD + 'px';
  var ctx = canvas.getContext('2d');
  var ov = $('ov');

  // ---------------------------------------------------------------- 画面流
  // 不用 <img src=流>：multipart/x-mixed-replace 在 <img> 里既不触发 load 也不触发
  // error，收没收到帧、卡在哪一步完全无从判断，出问题只能看到一片黑。
  // 改为 fetch + ReadableStream 自己读：每一帧都由代码解析并画进 canvas，
  // 于是「是否连上、帧率多少、每秒多少流量」都是可知的——省流量档位尤其需要这些数字。
  var streamCtl = null;
  var stat = { frames: 0, bytes: 0, lastSec: 0, fps: 0, kbps: 0 };

  function streamURL() {
    return API + '/stream?token=' + encodeURIComponent(token())
      + '&fps=' + cfg.fps + '&q=' + cfg.q + '&scale=' + (cfg.scale / 100)
      + '&gray=' + (cfg.gray ? 1 : 0) + '&still=' + (cfg.still ? 1 : 0)
      + '&cursor=' + (cfg.cursor ? 1 : 0)
      + '&_t=' + Date.now();
  }

  function stopStream() {
    if (streamCtl) { try { streamCtl.abort(); } catch (_) {} streamCtl = null; }
  }

  function concatU8(a, b) {
    var out = new Uint8Array(a.length + b.length);
    out.set(a, 0); out.set(b, a.length);
    return out;
  }
  function idxOf(u8, s, from) {
    var n = s.length, lim = u8.length - n, c0 = s.charCodeAt(0);
    for (var i = (from || 0); i <= lim; i++) {
      if (u8[i] !== c0) continue;
      var ok = true;
      for (var j = 1; j < n; j++) { if (u8[i + j] !== s.charCodeAt(j)) { ok = false; break; } }
      if (ok) return i;
    }
    return -1;
  }
  // 从缓冲里切出完整帧：--frame\r\n<headers>\r\n\r\n<数据>
  // rect：本帧只是「屏幕的某块区域」时由服务端带在 X-Frame-Rect 里（ROI 省流量），整帧时为 null。
  function splitFrames(u8) {
    var frames = [], start = 0;
    for (;;) {
      var i = idxOf(u8, '--frame', start);
      if (i < 0) break;
      var he = idxOf(u8, '\r\n\r\n', i);
      if (he < 0) break;
      var hdr = String.fromCharCode.apply(null, u8.subarray(i, he));
      var m = /Content-Length:\s*(\d+)/i.exec(hdr);
      if (!m) { start = i + 7; continue; }
      var len = parseInt(m[1], 10);
      var ds = he + 4;
      if (u8.length < ds + len) break;          // 数据没到齐，等下一块
      var rm = /X-Frame-Rect:\s*(\d+)\s*,\s*(\d+)\s*,\s*(\d+)\s*,\s*(\d+)/i.exec(hdr);
      frames.push({
        data: u8.subarray(ds, ds + len),
        rect: rm ? { x: +rm[1], y: +rm[2], w: +rm[3], h: +rm[4] } : null,
      });
      start = ds + len;
    }
    return { frames: frames, rest: u8.subarray(start) };
  }

  // 改画布尺寸必然清空内容，故先把旧画面按比例搬过去，避免切进/切出 ROI 时闪黑。
  function resizeCanvas(w, h) {
    var old = null;
    if (canvas.width && canvas.height) {
      try {
        old = document.createElement('canvas');
        old.width = canvas.width; old.height = canvas.height;
        old.getContext('2d').drawImage(canvas, 0, 0);
      } catch (e) { old = null; }
    }
    canvas.width = w; canvas.height = h;
    if (old) ctx.drawImage(old, 0, 0, w, h);
  }

  // rect 非 null → 这是屏幕的一块区域，画布保持「整屏后备」尺寸，只把这块贴到对应位置。
  // 关键：画布始终代表整块屏幕，toScreen() 的坐标映射与输入定位就完全不用改。
  async function drawFrame(u8, rect) {
    try {
      var bmp = await createImageBitmap(new Blob([u8], { type: 'image/jpeg' }));
      if (rect) {
        if (canvas.width !== screenW || canvas.height !== screenH) resizeCanvas(screenW, screenH);
        ctx.drawImage(bmp, rect.x, rect.y, rect.w, rect.h);
      } else {
        if (canvas.width !== bmp.width || canvas.height !== bmp.height) resizeCanvas(bmp.width, bmp.height);
        ctx.drawImage(bmp, 0, 0);
      }
      bmp.close();
      stat.frames++;
      return true;
    } catch (_) {
      return false;
    }
  }

  async function startStream() {
    stopStream();
    if (!online) return;
    var ctl = new AbortController();
    streamCtl = ctl;
    setState('wait', '连接中');
    try {
      var resp = await fetch(streamURL(), { signal: ctl.signal, cache: 'no-store' });
      if (resp.status === 401) requestToken();   // 令牌过期：索要新 token，下一次重连即可用上
      if (!resp.ok) throw new Error('HTTP ' + resp.status);
      var reader = resp.body.getReader();
      var buf = new Uint8Array(0);
      while (!ctl.signal.aborted) {
        var r = await reader.read();
        if (r.done) throw new Error('流已结束');
        stat.bytes += r.value.length;
        buf = concatU8(buf, r.value);
        var res = splitFrames(buf);
        buf = res.rest;
        for (var i = 0; i < res.frames.length; i++) {
          if (await drawFrame(res.frames[i].data, res.frames[i].rect)) {
            retry = 0;
            setWarn('');
            setState('on', '已连接');
          }
        }
        // 缓冲只留最后一个未完整帧，避免长时间运行后无限增长
        if (buf.length > 4 * 1024 * 1024) buf = new Uint8Array(0);
      }
    } catch (e) {
      if (ctl.signal.aborted) return;      // 主动停止（换档位 / 重连），不算断线
      setState('err', '已断开');
      scheduleRetry();
    }
  }

  function scheduleRetry() {
    if (retryTimer) return;
    var wait = Math.min(15000, 1000 * Math.pow(2, Math.min(retry, 4)));
    retry++;
    setWarn('连接中断，' + Math.round(wait / 1000) + 's 后自动重连…（也可点「重连」）');
    setState('wait', '重连中');
    retryTimer = setTimeout(function () {
      retryTimer = null;
      startStream();
    }, wait);
  }

  function setState(kind, text) {
    var d = $('dot');
    d.className = 'dot' + (kind === 'on' ? ' on' : kind === 'err' ? ' err' : kind === 'wait' ? ' wait' : '');
    $('state-txt').textContent = text;
  }
  function setWarn(t) { $('f-warn').textContent = t || ''; }

  // ---------------------------------------------------------------- 缩放
  function applyZoom() {
    if (!screenW) return;
    if (fitMode) {
      var r = view.getBoundingClientRect();
      // r 含 padding，扣掉四周 EDGE_PAD 得到可用内容区，否则画布会溢出边距贴到手机屏幕边缘
      var s = Math.min((r.width - 2 * EDGE_PAD) / screenW, (r.height - 2 * EDGE_PAD) / screenH);
      zoom = Math.max(0.1, Math.min(s, 1));
    }
    canvas.style.width = Math.round(screenW * zoom) + 'px';
    canvas.style.height = Math.round(screenH * zoom) + 'px';
    $('zoom-val').textContent = Math.round(zoom * 100) + '%';
    updateMeta();
    scheduleRoi();
  }

  // ---------------------------------------------------------------- ROI（只传正在看的区域）
  // 用户多数时间在放大看某个区域，整屏采集+编码的绝大多数像素都被浪费了。
  // 这里算出视口对应的屏幕矩形上报服务端，让它只抓、只编码、也只检测变化这一块；
  // 省下的带宽足以把分辨率提到原生（比降采样更清晰），静止检测也更容易命中。
  // 画布始终代表整块屏幕（见 drawFrame），故坐标映射与输入定位完全不受影响。
  var ROI_MARGIN = 0.25;     // 四周余量：小幅平移直接复用已收到的像素，不必重新推帧
  var ROI_MIN_GAIN = 0.92;   // 区域占比超过它就没省流量的意义，退回整帧
  var sentRoi = null, roiT = null;

  // 视口（不含余量）对应的屏幕矩形；越界部分不算——那部分本来就看不见
  function calcViewRect() {
    if (!screenW || !screenH) return null;
    var vr = view.getBoundingClientRect();
    var cr = canvas.getBoundingClientRect();
    if (!cr.width || !cr.height) return null;
    var l = Math.max(vr.left, cr.left), t = Math.max(vr.top, cr.top);
    var r = Math.min(vr.right, cr.right), b = Math.min(vr.bottom, cr.bottom);
    if (r <= l || b <= t) return null;
    return {
      x0: Math.max(0, Math.floor((l - cr.left) / cr.width * screenW)),
      y0: Math.max(0, Math.floor((t - cr.top) / cr.height * screenH)),
      x1: Math.min(screenW, Math.ceil((r - cr.left) / cr.width * screenW)),
      y1: Math.min(screenH, Math.ceil((b - cr.top) / cr.height * screenH)),
    };
  }

  function calcRoi() {
    var v = calcViewRect();
    if (!v || v.x1 - v.x0 <= 0 || v.y1 - v.y0 <= 0) return null;
    var mx = Math.round((v.x1 - v.x0) * ROI_MARGIN), my = Math.round((v.y1 - v.y0) * ROI_MARGIN);
    var x0 = Math.max(0, v.x0 - mx), y0 = Math.max(0, v.y0 - my);
    var x1 = Math.min(screenW, v.x1 + mx), y1 = Math.min(screenH, v.y1 + my);
    if (x1 - x0 <= 0 || y1 - y0 <= 0) return null;
    if ((x1 - x0) * (y1 - y0) >= screenW * screenH * ROI_MIN_GAIN) return null;   // 接近全屏 → 退回整帧
    return { x: x0, y: y0, w: x1 - x0, h: y1 - y0 };
  }

  function roiSame(a, b) {
    return (!a && !b) || !!(a && b && a.x === b.x && a.y === b.y && a.w === b.w && a.h === b.h);
  }

  function reportRoi() {
    var v = calcViewRect();
    var r = calcRoi();
    // 视口仍完整落在已上报区域内 → 手上像素还够用，不必惊动服务端（连续平移时几乎不产生上报）
    if (r && sentRoi && v && v.x0 >= sentRoi.x && v.y0 >= sentRoi.y &&
        v.x1 <= sentRoi.x + sentRoi.w && v.y1 <= sentRoi.y + sentRoi.h) return;
    if (roiSame(r, sentRoi)) return;
    sentRoi = r;
    updateMeta();
    api('/viewport', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(r ? { x: r.x, y: r.y, w: r.w, h: r.h } : { none: true }),
    }).catch(function () {});
  }
  function scheduleRoi() { clearTimeout(roiT); roiT = setTimeout(reportRoi, 120); }
  // 锚点缩放：缩放时保持客户端锚点 (ax,ay) 下的内容不动（默认视口中心）。
  // 双指捏合传「初始双指中点」做锚点，缩放即围绕该点、跟手不漂移。
  function setZoom(z, keepFit, ax, ay) {
    fitMode = !!keepFit;
    z = Math.max(0.1, Math.min(4, z));
    var vr = view.getBoundingClientRect();
    var cr = canvas.getBoundingClientRect();
    if (ax == null) { ax = vr.left + vr.width / 2; ay = vr.top + vr.height / 2; }
    var cx = (ax - cr.left) / cr.width * screenW;   // 锚点对应的内容坐标（屏幕像素）
    var cy = (ay - cr.top) / cr.height * screenH;
    zoom = z;
    applyZoom();
    // 让该内容坐标在缩放后仍停留在原客户端位置 (ax,ay)
    // 注意 +EDGE_PAD：content 盒相对 border-box 左/上偏移了一个 padding，scrollLeft=0 时
    // 内容左缘在 vr.left+EDGE_PAD 处，算滚动量必须把这个偏移补回来（否则锚点偏一个边距）。
    view.scrollLeft = vr.left + EDGE_PAD - ax + cx * z;
    view.scrollTop = vr.top + EDGE_PAD - ay + cy * z;
    savePrefsSoon();      // 缩放值与平移位置一并落盘（防抖：捏合高频变更不卡顿）
    scheduleRoi();        // 缩放会改变可见区域 → 重新上报 ROI
  }

  // 双指手势的统一表达：把「屏幕内容点 (cxp,cyp)」摆到「客户端位置 (ax,ay)」，同时把缩放设为 z。
  // setZoom 只能让 (ax,ay) 处的内容**原地不动**（缩放锚点＝目标点，二者是同一点）；
  // 这里把它拆成「内容点」与「目标位置」两个独立量，于是**缩放与平移可以同时发生**：
  //   (cxp,cyp) = 手势开始时双指中心下的内容（锚点，全程固定不变）
  //   (ax,ay)   = 当前双指中心
  // 手指中心移动 → 目标位置移动 → 画面跟着手指走；手指间距变化 → z 变化 → 以锚点为中心缩放。
  function setZoomAt(z, cxp, cyp, ax, ay) {
    fitMode = false;
    z = Math.max(0.1, Math.min(4, z));
    zoom = z;
    applyZoom();
    // canvas 左上角的客户端坐标 = vr.left + EDGE_PAD - view.scrollLeft
    // 故内容点 (cxp,cyp) 的客户端位置 = vr.left + EDGE_PAD - scrollLeft + cxp*z，令其等于 ax：
    var vr = view.getBoundingClientRect();
    view.scrollLeft = vr.left + EDGE_PAD + cxp * z - ax;
    view.scrollTop = vr.top + EDGE_PAD + cyp * z - ay;
    savePrefsSoon();
    scheduleRoi();
  }
  $('zoom-in').addEventListener('click', function () { setZoom(zoom * 1.25, false); });
  $('zoom-out').addEventListener('click', function () { setZoom(zoom / 1.25, false); });
  Array.prototype.forEach.call(document.querySelectorAll('[data-fit]'), function (b) {
    b.addEventListener('click', function () {
      if (b.dataset.fit === '1') { fitMode = true; applyZoom(); }
      else { fitMode = false; setZoom(1, false); }
      writePrefs();
    });
  });
  // 平移/缩放都改变可见区域：落盘 + 重新上报 ROI（均防抖，连续拖动也不会刷爆请求）
  view.addEventListener('scroll', function () { savePrefsSoon(); scheduleRoi(); });
  $('btn-fs').addEventListener('click', function () {
    if (document.fullscreenElement) document.exitFullscreen();
    else if (view.requestFullscreen) view.requestFullscreen();
  });

  // ---------------------------------------------------------------- 输入
  var MOVE_MS = 30;          // 鼠标移动节流：再密也没有意义，只会白烧流量
  var lastMove = 0, pending = null, composing = false;

  // ---- 输入通道：优先 WebSocket，不可用时自动降级 HTTP ----
  // HTTP 下每个输入事件都是一次 POST，要 浏览器→主服务→扩展宿主→代理 三跳；
  // 滚轮 30ms 节流就是 33 req/s，手机网络下 RTT 几十毫秒 + 同域并发排队 → 输入延迟雪崩。
  // WS 一次握手后每个事件只是一个帧，没有 per-event HTTP 开销、也不受并发排队影响。
  // 注意必须**直连扩展宿主**：主服务代理不处理 Upgrade: websocket，握手过不去，
  // 所以 ws_port 由 /status 下发，前端据此拼直连地址。
  var inputWs = null, wsOpen = false, wsRetry = 0, wsTimer = null, wsPort = 0;

  function wsConnect() {
    if (!wsPort || typeof WebSocket === 'undefined') return;
    if (inputWs && (wsOpen || inputWs.readyState === 0)) return;   // 已连接 / 连接中
    var url = (location.protocol === 'https:' ? 'wss://' : 'ws://')
      + location.hostname + ':' + wsPort + API + '/ws?token=' + encodeURIComponent(token());
    try { inputWs = new WebSocket(url); } catch (_) { inputWs = null; return; }
    inputWs.onopen = function () { wsOpen = true; wsRetry = 0; };
    inputWs.onclose = function () { wsOpen = false; inputWs = null; scheduleWs(); };
    inputWs.onerror = function () { try { inputWs.close(); } catch (_) {} };
  }
  function scheduleWs() {
    clearTimeout(wsTimer);
    wsTimer = setTimeout(wsConnect, Math.min(8000, 500 * Math.pow(2, wsRetry++)));
  }

  function send(ev) {
    if (!online) return;
    if (wsOpen && inputWs && inputWs.readyState === 1) {
      try { inputWs.send(JSON.stringify(ev)); return; } catch (_) { wsOpen = false; }
    }
    // 降级：WS 不可用/未就绪时仍走 HTTP，保证功能不中断
    fetch(API + '/input', {
      method: 'POST',
      headers: { 'Authorization': 'Bearer ' + token(), 'Content-Type': 'application/json' },
      body: JSON.stringify(ev),
    }).catch(function () {});
  }

  // 画布坐标 → 屏幕坐标。canvas 的 CSS 尺寸就是「屏幕尺寸 × zoom」，
  // 所以按显示宽度归一化即可，缩放后无需额外换算。
  function toScreen(cx, cy) {
    var r = canvas.getBoundingClientRect();
    if (!r.width || !screenW) return null;
    return {
      x: Math.round((cx - r.left) / r.width * screenW),
      y: Math.round((cy - r.top) / r.height * screenH),
    };
  }

  canvas.addEventListener('mousemove', function (e) {
    if (touchActive) return;                    // 触摸进行中：屏蔽合成鼠标事件
    var p = toScreen(e.clientX, e.clientY);
    if (!p) return;
    var now = Date.now();
    pending = p;
    if (now - lastMove < MOVE_MS) return;
    lastMove = now;
    send({ type: 'mouse_move', x: p.x, y: p.y });
  });
  setInterval(function () {          // 收尾：停手后补发最后一个位置，避免差半格
    if (pending) { send({ type: 'mouse_move', x: pending.x, y: pending.y }); pending = null; }
  }, MOVE_MS * 2);

  var downSent = false;   // 仅当在画布上真正按下左/右键，松手才发 mouse_up；点在画布外（如操作栏）不算
  canvas.addEventListener('mousedown', function (e) {
    if (touchActive) return;
    e.preventDefault();
    var p = toScreen(e.clientX, e.clientY);
    if (!p) return;
    if (e.button === 1) { startPan(e); return; }   // 中键：本地平移，不发给远程
    spawnClickFx(e.clientX, e.clientY);             // 点击反馈动画（非中键）
    send({ type: 'mouse_down', x: p.x, y: p.y, button: btnName(e.button) });
    downSent = true;
  });
  window.addEventListener('mouseup', function (e) {
    if (touchActive || !downSent) return;
    downSent = false;
    var p = toScreen(e.clientX, e.clientY);
    if (p) {
      p.x = Math.max(0, Math.min(screenW, p.x));   // 拖出画布外松手：坐标贴边，不越界
      p.y = Math.max(0, Math.min(screenH, p.y));
      send({ type: 'mouse_up', x: p.x, y: p.y, button: btnName(e.button) });
    }
  });
  canvas.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  canvas.addEventListener('wheel', function (e) {
    if (e.ctrlKey) {                  // Ctrl+滚轮 = 本地缩放，远程无感
      e.preventDefault();
      setZoom(zoom * (e.deltaY < 0 ? 1.12 : 1 / 1.12), false, e.clientX, e.clientY);
      return;
    }
    e.preventDefault();
    send({ type: 'wheel', dx: e.deltaX, dy: -e.deltaY });
  }, { passive: false });

  // 点击反馈：在 (clientX,clientY) 处生成一个扩散圆环，约 380ms 后自动移除。
  // 坐标换算到 .view 内容坐标系（含滚动），圆环随画布滚动、位置贴合点击点。
  function spawnClickFx(clientX, clientY) {
    var vr = view.getBoundingClientRect();
    var el = document.createElement('div');
    el.className = 'click-fx';
    el.style.left = (clientX - vr.left + view.scrollLeft) + 'px';
    el.style.top = (clientY - vr.top + view.scrollTop) + 'px';
    view.appendChild(el);
    setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 380);
  }

  // ---- 触摸指示器：按下即显示落点，并把长按阈值做成可见的进度 ----
  var touchInd = document.createElement('div');
  touchInd.className = 'touch-ind';
  touchInd.innerHTML = '<div class="fill"></div>';
  view.appendChild(touchInd);

  function indSetPos(clientX, clientY) {
    var vr = view.getBoundingClientRect();
    touchInd.style.left = (clientX - vr.left + view.scrollLeft) + 'px';
    touchInd.style.top = (clientY - vr.top + view.scrollTop) + 'px';
  }
  var indHideT = null;
  function indStart(clientX, clientY) {
    clearTimeout(indHideT);
    touchInd.className = 'touch-ind';                    // 先清掉 charging，确保 transition 重新起效
    touchInd.style.setProperty('--dur', RIGHT_DELAY + 'ms');
    indSetPos(clientX, clientY);
    void touchInd.offsetWidth;                           // 强制重排，否则同一帧内加 class 不会有过渡
    touchInd.className = 'touch-ind on charging';
  }
  function indMove(clientX, clientY) { indSetPos(clientX, clientY); }
  function indDrag() { clearTimeout(indHideT); touchInd.className = 'touch-ind on drag'; }
  // armed：按住满 DRAG_HOLD —— 此时拖动 = 拖拽远端内容（内圈继续长，满 RIGHT_DELAY 转右键）
  function indArm() { clearTimeout(indHideT); touchInd.className = 'touch-ind on charging armed'; }
  function indRemote() { clearTimeout(indHideT); touchInd.className = 'touch-ind on remote'; }
  function indRight() { clearTimeout(indHideT); touchInd.className = 'touch-ind on right'; }
  // delay>0：保留一小段时间再收，用于让右键的绿色确认「看得见」（否则一松手就没了）
  function indHide(delay) {
    clearTimeout(indHideT);
    if (delay) {
      indHideT = setTimeout(function () { touchInd.className = 'touch-ind'; }, delay);
      return;
    }
    touchInd.className = 'touch-ind';
  }

  function btnName(b) { return b === 2 ? 'right' : b === 1 ? 'middle' : 'left'; }

  var pan = null;
  function startPan(e) {
    pan = { x: e.clientX, y: e.clientY, sl: view.scrollLeft, st: view.scrollTop };
    view.classList.add('grabbing');
    e.preventDefault();
  }
  window.addEventListener('mousemove', function (e) {
    if (touchActive) return;
    if (!pan) return;
    view.scrollLeft = pan.sl - (e.clientX - pan.x);
    view.scrollTop = pan.st - (e.clientY - pan.y);
  });
  window.addEventListener('mouseup', function () { pan = null; view.classList.remove('grabbing'); });

  // ---- 键盘：隐藏 textarea 接管，中文等输入法内容才能正确上屏 ----
  var kb = $('kb');
  // 注意：canvas 点击**不再**自动聚焦 #kb —— 否则一碰屏幕软键盘就弹、且关不掉。
  var SPECIAL = {
    enter: 1, backspace: 1, tab: 1, escape: 1, esc: 1, delete: 1, insert: 1,
    home: 1, end: 1, pageup: 1, pagedown: 1, arrowleft: 1, arrowup: 1,
    arrowright: 1, arrowdown: 1, space: 1, capslock: 1, printscreen: 1,
  };
  kb.addEventListener('compositionstart', function () { composing = true; });
  kb.addEventListener('compositionend', function (e) {
    composing = false;
    if (e.data) send({ type: 'text', text: e.data });
    kb.value = '';
    justComposed = true;   // 吞掉提交后紧随的那个 input（里面是同一段已上屏文本）
  });
  // 普通字符走 input 事件上屏：手机软键盘在 keydown 里常给不到正确字符（key 多为
  // "Unidentified"/keyCode 229），但每次落字都可靠触发 input；桌面端也走 input 更稳。

        if (pd) { send({ type: 'mouse_move', x: pd.x, y: pd.y }); touch.last = pd; }
      } else {
        // 平移本地视角（滚动画布）
        view.scrollLeft -= (t.clientX - touch.lcx);
        view.scrollTop  -= (t.clientY - touch.lcy);
      }
      touch.lcx = t.clientX; touch.lcy = t.clientY;
      indMove(t.clientX, t.clientY);             // 落点标记跟随手指（内容坐标，故画面同步移动时它不动）
    }
  }, { passive: false });

  function endTouch(e) {
    if (e) e.preventDefault();
    clearTimeout(lpTimer);
    if (touch) {
      if (touch.down) {
        // 远程拖拽结束：按下已在进入拖拽时发过，这里补抬起。
        // 漏发会让远端鼠标**一直卡在按下状态**（表现为东西被粘住跟着跑）。
        send({ type: 'mouse_up', x: touch.last.x, y: touch.last.y, button: 'left' });
      } else if (!suppressUp && !touch.moved) {
        // 只有「没移动过且没发过右键」才当作一次左键点击（波纹反馈）；
        // 移动过＝平移，右键已发＝suppressUp，均不触发。
        send({ type: 'mouse_click', x: touch.p.x, y: touch.p.y, button: 'left', clicks: 1 });
        spawnClickFx(touch.sx, touch.sy);        // 波纹＝点击已确认发出的回执
      }
      touch = null;
      clearTimeout(dragArmT);
      // 松手收起落点标记；右键已触发时多留 420ms，让用户看清绿色确认
      indHide(suppressUp ? 420 : 0);
    }
    if (e && e.touches.length <= 1) {
      if (pinch && pinch.zoomMode === false) flushWheel();   // 手势结束：把残余滚动量发出去
      pinch = null;                                          // 双指松开到单指：结束捏合/滚轮
    }
    if (e && e.touches.length === 0) {
      // 部分 WebView 在 touchend 后约 300ms 仍补发合成 mousedown/up，
      // 若此刻 touchActive 已为 false，这些合成事件会穿透桌面鼠标处理器→远端误触发点击。
      // 延迟复位，确保合成事件期间仍被屏蔽。
      clearTimeout(touchEndTimer);
      touchEndTimer = setTimeout(function () { touchActive = false; }, 600);
    }
  }
  canvas.addEventListener('touchend', endTouch, { passive: false });
  canvas.addEventListener('touchcancel', function () {
    clearTimeout(lpTimer);
    clearTimeout(dragArmT);
    if (touch && touch.down && !suppressUp) send({ type: 'mouse_up', x: touch.last.x, y: touch.last.y, button: 'left' });
    touch = null; pinch = null; suppressUp = false; touchActive = false;
    indHide();
  }, { passive: false });

  // 底部手势提示
  var tip = $('f-tip');
  if (tip) tip.textContent = '单指：轻点=左键｜立即拖=平移视角｜按住变橙后拖=拖拽远端｜长按变绿=右键；双指：捏合=缩放（可同时拖移视角），同向滑动=滚轮';

  // ---------------------------------------------------------------- 档位 / 细项
  function fillAdv() {
    $('a-fps').value = cfg.fps; $('v-fps').textContent = cfg.fps;
    $('a-q').value = cfg.q; $('v-q').textContent = cfg.q;
    $('a-scale').value = cfg.scale; $('v-scale').textContent = cfg.scale + '%';
    $('a-gray').checked = !!cfg.gray;
    $('a-still').checked = !!cfg.still;
  }
  function readAdv() {
    cfg.fps = +$('a-fps').value; cfg.q = +$('a-q').value;
    cfg.scale = +$('a-scale').value; cfg.gray = $('a-gray').checked;
    cfg.still = $('a-still').checked;
  }
  $('btn-adv').addEventListener('click', function () {
    var p = $('adv');
    var show = p.style.display === 'none';
    p.style.display = show ? '' : 'none';
    this.classList.toggle('on', show);
  });
  $('a-fps').addEventListener('input', function () { $('v-fps').textContent = this.value; });
  $('a-q').addEventListener('input', function () { $('v-q').textContent = this.value; });
  $('a-scale').addEventListener('input', function () { $('v-scale').textContent = this.value + '%'; });
  $('btn-apply').addEventListener('click', function () { readAdv(); startStream(); updateMeta(); writePrefs(); });
  $('btn-reset').addEventListener('click', function () {
    cfg = Object.assign({}, PRESETS[presetName] || BASE_PRESETS[presetName] || BASE_PRESETS.balanced);
    fillAdv(); startStream(); updateMeta(); writePrefs();
  });
  $('preset').addEventListener('change', function () {
    presetName = this.value;
    cfg = Object.assign({}, PRESETS[presetName] || BASE_PRESETS[presetName] || BASE_PRESETS.balanced);
    fillAdv(); lastStreamKey = ''; startStream(); updateMeta(); writePrefs();   // 强制重建流，确保切档立刻生效
  });

  function updateMeta() {
    var bits = [];
    if (screenW) bits.push(screenW + '×' + screenH);
    bits.push(cfg.fps + 'fps');
    bits.push('质量 ' + cfg.q);
    if (cfg.scale < 100) bits.push('分辨率 ' + cfg.scale + '%');
    if (cfg.gray) bits.push('灰度');
    if (cfg.still) bits.push('静止不推帧');
    bits.push('缩放 ' + Math.round(zoom * 100) + '%');
    if (sentRoi) bits.push('区域 ' + sentRoi.w + '×' + sentRoi.h);   // 生效中的 ROI，便于核对省流量是否真的在工作
    if (stat.fps || stat.kbps) bits.push('实测 ' + stat.fps + 'fps · ' + stat.kbps + ' KB/s');
    $('f-meta').textContent = bits.join(' · ');
  }

  // 每秒算一次实测帧率与码率——省流量档位下这两个数字才是判断依据
  var _lastSnap = { t: Date.now(), f: 0, b: 0 };
  setInterval(function () {
    var now = Date.now();
    var dt = (now - _lastSnap.t) / 1000;
    if (dt < 0.9) return;
    stat.fps = Math.round((stat.frames - _lastSnap.f) / dt);
    stat.kbps = Math.round((stat.bytes - _lastSnap.b) / 1024 / dt);
    _lastSnap = { t: now, f: stat.frames, b: stat.bytes };
    updateMeta();
  }, 1000);

  // ---------------------------------------------------------------- 引导 / 状态轮询
  function showOverlay(title, text, btns, spin) {
    $('ov-title').textContent = title;
    $('ov-text').innerHTML = text || '';
    $('ov-spin').style.display = spin === false ? 'none' : '';
    var box = $('ov-btns');
    box.innerHTML = '';
    (btns || []).forEach(function (b) {
      var el = document.createElement('button');
      el.textContent = b.text;
      if (b.ghost) el.className = 'ghost';
      el.addEventListener('click', b.onClick);
      box.appendChild(el);
    });
    ov.style.display = '';
  }
  function hideOverlay() { ov.style.display = 'none'; }

  function agentGuide(err) {
    // 安装失败必须把服务端原因显示出来：计划任务创建涉及账户与权限，
    // 失败原因五花八门，静默重试只会让人反复点同一个按钮而毫无反馈
    function doInstall() {
      showOverlay('正在安装…', '正在创建计划任务并启动代理…', [], true);
      api('/agent/install', { method: 'POST' })
        .then(function (r) { return r.json().catch(function () { return {}; }); })
        .then(function (d) {
          if (d && d.success) {
            showOverlay('已安装', '正在等待代理就绪…', [], true);
            setTimeout(poll, 1500);
            return;
          }
          showOverlay('安装失败', esc((d && d.message) || '未知错误'),
                      [{ text: '重试', onClick: doInstall }], false);
        }).catch(function (e) {
          showOverlay('安装失败', '请求失败：' + esc(String(e)),
                      [{ text: '重试', onClick: doInstall }], false);
        });
    }
    var btns = [{
      text: autostart ? '立即启动代理' : '安装开机自启并启动',
      onClick: doInstall,
    }];
    showOverlay('桌面代理未运行',
      '画面采集与鼠标键盘注入必须由运行在<b>登录会话</b>里的代理进程完成——'
      + 'Dbox 服务本身被 Windows 隔离在没有桌面的 Session 0，抓不到任何画面。<br><br>'
      + '点击下方按钮把它设为「登录时自动启动」（Windows 计划任务），之后每次开机都会自动就绪。'
      + (err ? '<br><span style="color:#6e7681">服务端返回：' + esc(err) + '</span>' : ''),
      btns, false);
  }

  var lastStreamKey = '';
  function poll() {
    api('/status').then(function (r) {
      // 401/403 必须显式抛错交给下面的 catch 弹「登录已过期」：
      // 若像以前那样只判 d.success 后静默 return，界面就会一直停在「重连中」且毫无提示。
      if (r.status === 401 || r.status === 403) {
        var e = new Error('unauthorized'); e.unauthorized = true; throw e;
      }
      return r.json();
    }).then(function (d) {
      if (!d || !d.success) return;
      autostart = !!d.autostart;
      // 拿到扩展宿主直连端口后建立 WebSocket 输入通道（失败会自动降级 HTTP）
      if (d.ws_port && d.ws_port !== wsPort) { wsPort = d.ws_port; wsRetry = 0; }
      wsConnect();
      if (d.online && d.info && d.info.screen) {
        online = true;
        var sw = d.info.screen.w, sh = d.info.screen.h;
        var changed = (sw !== screenW || sh !== screenH);
        screenW = sw; screenH = sh;
        hideOverlay();
        if (d.presets) PRESETS = Object.assign({}, PRESETS, d.presets);   // 合并不整体替换，保留三档基准
        var key = [cfg.fps, cfg.q, cfg.scale, cfg.gray, cfg.still].join('|');
        // 只在「首次连上」「分辨率变了」「档位变了」时重建流——
        // 否则轮询会不停打断正在看的画面
        if (changed || key !== lastStreamKey) {
          lastStreamKey = key;
          applyZoom();
          restoreView();      // 画布尺寸就绪后还原上次平移位置（避免刷新甩到左上角）
          reportRoi();        // 立即上报一次，确保首帧就按 ROI 传（而不是先传整屏再切）
          startStream();
        }
        updateMeta();
      } else {
        online = false;
        stopStream();
        agentGuide(d.error || '');
        setState('err', '代理未运行');
      }
    }).catch(function (err) {
      online = false;
      stopStream();
      if (err && err.unauthorized) {
        // 认证失败必须明说：否则 /stream 会一直 401 并退避重试，界面只剩一个「重连中」，
        // 用户完全无从判断是代理没起、服务没起、还是自己登录过期了。
        setState('err', '登录已过期');
        showOverlay('登录已过期',
          '访问令牌有效期为 24 小时，已过期或已在别处登出。<br><br>'
          + '请<b>回到 Dbox 主界面重新登录</b>后再刷新本页；若确认当前是登录状态，'
          + '可点下方按钮重新向主界面索取令牌。',
          [{ text: '重新获取令牌', onClick: function () { requestToken(); setTimeout(poll, 500); } }],
          false);
      } else {
        setState('err', '服务不可达');
        showOverlay('无法连接', '请确认 Dbox 正在运行。稍后自动重试。', [], true);
      }
    }).then(function () {
      clearTimeout(pollTimer);
      pollTimer = setTimeout(poll, online ? 3000 : 1500);
    });
  }

  $('btn-reconnect').addEventListener('click', function () {
    if (retryTimer) { clearTimeout(retryTimer); retryTimer = null; }
    retry = 0;
    setWarn('');
    lastStreamKey = '';       // 强制重建流
    poll();
  });
  // 重启代理：先停流，打 /agent/start（后端会先杀旧进程再拉起，确保换上新代码），
  // 等几秒让新进程就绪后重连。画圆连直线这类只跟新代码相关的修复，靠这个按钮生效。
  $('btn-restart-agent').addEventListener('click', function () {
    var btn = this;
    btn.disabled = true;
    stopStream();
    setWarn('正在重启桌面代理…');
    setState('wait', '重启中');
    api('/agent/start', { method: 'POST' })
      .then(function (r) { return r.json().catch(function () { return {}; }); })
      .then(function (d) {
        setWarn((d && d.message) ? ('已发送重启：' + d.message) : '已发送重启，稍候自动重连…');
      })
      .catch(function (e) { setWarn('重启请求失败：' + String(e)); })
      .then(function () {
        setTimeout(function () {
          btn.disabled = false;
          retry = 0;
          lastStreamKey = '';
          poll();
        }, 2500);
      });
  });
  window.addEventListener('resize', function () { if (document.activeElement === kb) syncKb(); else if (fitMode) applyZoom(); });
  window.addEventListener('online', function () { $('btn-reconnect').click(); });

  fillAdv();
  poll();
})();
</script>
</body>
</html>
